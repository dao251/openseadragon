<!DOCTYPE html>
<html>
<head>
    <title>Drawer Demo</title>
    <style type="text/css">
        html, body{
            font-family: monospace;
        }
        .openseadragon1 {
            /* DEMO: to provide device pixel misalignment (simulate real-life page layouts) */
            /* 0.4px guarantees misalignment for DPR = 1.5, 2, 3  */
            /* position: relative; */
            /* left: 0.4px; */
            /* top: 0.4px; */
            margin: 0px;
            border: 0px;
            width: 512px;
            height: 768px;
            background-color: rgb(200,200,255);
        }
        .openseadragon-canvas:focus {
            outline: none;
            box-shadow: none;
        }
        #scale {-moz-appearance:textfield; appearance:textfield;}
        #scale::-webkit-inner-spin-button,
        #scale::-webkit-outer-spin-button {-webkit-appearance:none; appearance:none;}
        #control_form {
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 5px;
        }
    </style>
</head>
<body>
    <div>
        <select id="images" onchange="restartViewers()">
        </select>
    </div>
    <div style="width: 300px; margin-top:30px; display: flex;">
        <div>
            <select id="viewer0" onchange="restartViewers()"></select>
            <iframe id="0" class="openseadragon1"></iframe>
        </div>
        <div style="display:flex; flex-direction:column;">
        <form id="control_form" onsubmit="return false;">
            <div> </div>
            <div> </div>
            <div style="border-bottom:1px solid #000;"> </div>
            <div> </div>
            <label>&lt;-Level: <span id="level"> </span></label>
            <label>&lt;-Tile Scale</label>
            <input id="scale" type=number step=any onchange="onScale(this.value);">
            <button id="perfect-btn" onclick="onPerfect();">Zoom to Pixels</button>
            <label> </label>
            <label>&lt;-LoD Range Factor: <span id="lrf">1.0</span></label>
            <input type="range" min="0" max="4" step="0.1" value="1" oninput="setRangeFactor(this.value)">
            <!-- <label>&lt;-<input type="checkbox" onchange="snapToDevice( this.checked )" checked>Snap To DevPx</label> -->
            <label> </label>
            <div style="border-bottom:1px solid #000;"></div>
            <label> </label>
            <label>Image</label>
            <label><input type="checkbox" onchange="rotate( this.checked * 30 )">Rotate</label>
            <label><input type="checkbox" onchange="flip(this.checked)">Flip</label>
            <label><input type="checkbox" onchange="clip(this.checked)">Clip</label>
            <label><input type="checkbox" onchange="opacity(this.checked)">Opacity</label>
            <div>GCO: <select onchange="onGCOselect(this.value)" id="gco_select"></select></div>
            <label> </label>
            <label><input type="checkbox" onchange="debug(this.checked)">Tile Grid</label>
            <label><input type="checkbox" onchange="smooth(this.checked)" checked>Smooth</label>
            <!-- <label><input type="checkbox" onchange="snapToDevice(this.checked)" checked>Snap to Device Px</label> -->
        </form>
    </div>
        <div>
            <select id="viewer1" onchange="restartViewers()"></select>
            <iframe id="1" class="openseadragon1"></iframe>
        </div>
    </div>
    <!-- <div>
        <pre id="out" style="height:400px; width:1100px; overflow-y:auto;"></pre>
    </div> -->

    <script id="code" type="text/javascript">



        const images = [
            {
                tileSource: "../../test/data/monalisa.dzi",
                text: "DZI Mona Lisa : 80MP (7479x11146 px) JPEG tiled into 256x256 (PNG) tiles",
                clip: [ 1024, 768, 3072, 4096 ],
            },
            {
                text: "DZI BBlue : 1000x1000 PNG",
                tileSource: {
                    tileSource: "../../test/data/bblue.dzi",
                    placeholderFillStyle: "red",
                    // function(tiledImage, context) {
                    //     // Create a gray to light-gray linear gradient using the correct context
                    //     var gradient = context.createLinearGradient(0, 0, 256, 256);
                    //     gradient.addColorStop(0, '#dddddd');
                    //     gradient.addColorStop(1, '#ffffff');
                    //     return gradient;
                    // },
                 },
                clip: [ 200, 200, 500, 500 ],
            },
            {
                text: "IIP TileSource: Huge WSI slide tiled into 256x256 JPEG tiles with no overlap",
                tileSource: {
                    iipsrv: "https://merovingio.c2rmf.cnrs.fr/fcgi-bin/iipsrv.fcgi",
                    image:  "77917.ome.tif",
                    format: "jpg",      // jpeg creates tiling artifacts on the server, need overlaps !!!
                    transform:  {
                        contrast: 1.5,
                        twist: "[0,0,1;0,1,0;0.9,0,0.1]"
                    }
                },
                clip: [ 20000, 15000, 10000, 10000],
            },
            {
                text: 'DZI : 4096x4096 PNG - 1px grid (every 8px)',
                tileSource: "../../test/data/8px_grid.dzi",
                clip: [ 1000, 1000, 1000, 1000 ],
            },
            {
                text: "OpenStreetMaps",
                tileSource: { type: 'openstreetmaps', width: 67108864, height: 67108864 },
            },
            {
                tileSource: "https://openseadragon.github.io/example-images/duomo/duomo.dzi",
                text: "DZI Duomo : (13920x10200 px) image tiled into 254x254 (jpg) tiles with 1px overlap",
                clip: [ 1024, 768, 3072, 4096 ],
            },


        ];
        const viewers = [
                {   version: "dao251 5.1.0 'drawer'",
                    url: "../../build/openseadragon/openseadragon.js",
                    viewerOptions:{
                        drawer:'drawer',
                        maxImageCacheCount: 1000,
                        snapToDevicePixels: true,      // does not work yet...
                        lodRangeFactor: 1,
                        fetchOptions:{},
                    }
                },
                {   version: "OSD 6.0.2 'canvas'",
                    url: "../../.ver/OSD.6.0.2/openseadragon.js",
                    viewerOptions: { drawer:'canvas' },
                },
                {   version: "OSD 6.0.2 'webgl'",
                    url: "../../.ver/OSD.6.0.2/openseadragon.js",
                    viewerOptions: { drawer:'webgl', loadTilesWithAjax: true },
                },
                {   version: "OSD 5.0.1 'canvas'",
                    url: "../../.ver/OSD.5.0.1/openseadragon.js",
                    viewerOptions: { drawer:'canvas' },
                },
                {   version: "OSD 5.0.1 'webgl'",
                    url: "../../.ver/OSD.5.0.1/openseadragon.js",
                    viewerOptions: { drawer:'webgl' },
                },
                {   version: "OSD 4.1.1 ",
                    url: "../../.ver/OSD.4.1.1/openseadragon.js",
                    viewerOptions: { },
                },
            ]

        window.OSD = {
            viewerOptions : {
                prefixUrl: "../../build/openseadragon/images/",
                showRotationControl: true,
                showFlipControl: true,
                showNavigator: true,

                rotationIncrement: 22.5,
                zoomPerScroll: 1.2,
                lodRangeFactor: 1,

                minZoomLevel: 0.01,
                maxZoomPixelRatio: 4.00,
            },
        };

        const imageSelector = document.getElementById('images');
        for (let i=0; i<images.length; i++){
            imageSelector.add(new Option( images[i].text, i));
        }

        document.getElementById("viewer0").replaceChildren();
        document.getElementById("viewer1").replaceChildren();
        buildViewerSelect();

        function restartViewers () {
            OSD.viewerOptions.tileSources = [
                    { tileSource: { type:"image", url:"../../test/data/abstract_2048.png", buildPyramid: false}, opacity: 0 },
                    images[imageSelector.value].tileSource,
                ];
            document.getElementById("control_form")?.reset();
            document.getElementById("gco_select").replaceChildren();
            buildGCOSelect();

            OSD.viewers = [
                viewers[document.getElementById("viewer0").value],
                viewers[document.getElementById("viewer1").value],
            ];

            document.getElementById(0).src = document.getElementById(1).src = "_viewer.html";
        }
        restartViewers();

        let isSyncing = false;

        OSD.syncHandler = function (event) {
            const from = this.userData?.id
            const me    = OSD.viewers[from].viewer;
            const other = OSD.viewers[Number(!from)].viewer;
            if (!isSyncing && me && other){
                isSyncing = true;
                other.viewport.zoomTo(me.viewport.getZoom());
                other.viewport.panTo(me.viewport.getCenter());
                other.viewport.rotateTo(me.viewport.getRotation());
                other.viewport.setFlip(me.viewport.flipped);
                isSyncing = false;
            }
            try{
                const tiledImage = OSD.viewers[0].viewer.world.getItemAt(1);
                const scale = tiledImage.lastDrawnTileScale;
                const level = tiledImage.lastDrawnLevel;
                document.getElementById("scale").value = scale.toFixed(17);
                document.getElementById("perfect-btn").disabled =( scale === Math.round(scale) );
                document.getElementById("level").textContent = level;
            }catch(e){}
        }

        OSD.animationHandler = function (event) {
            try{
                const tiledImage = OSD.viewers[0].viewer.world.getItemAt(1);
                const scale = tiledImage.lastDrawnTileScale;
                const level = tiledImage.lastDrawnLevel;
                document.getElementById("scale").value = scale.toFixed(17);
                document.getElementById("perfect-btn").disabled =( scale === Math.round(scale) );
                document.getElementById("level").textContent = level;
            }catch(e){}
        }

        function debug(v) {
            OSD.viewers[0].viewer.setDebugMode(v);
            OSD.viewers[1].viewer.setDebugMode(v);
        }

        function flip(v) {
            OSD.viewers[0].viewer.world.getItemAt(1).setFlip(v);
            OSD.viewers[1].viewer.world.getItemAt(1).setFlip(v);
        }

        function clip(v) {
            const rect = (v ? images[imageSelector.value].clip : undefined);
            if(rect){
                OSD.viewers[0].viewer.world.getItemAt(1).setClip(
                    new OSD.viewers[0].OpenSeadragon.Rect(...rect)
                );
                OSD.viewers[1].viewer.world.getItemAt(1).setClip(
                    new OSD.viewers[1].OpenSeadragon.Rect(...rect)
                );
            }else{
                OSD.viewers[0].viewer.world.getItemAt(1).setClip(null);
                OSD.viewers[1].viewer.world.getItemAt(1).setClip(null);
            }
        }

        function rotate(v) {
            OSD.viewers[0].viewer.world.getItemAt(1).setRotation(v);
            OSD.viewers[1].viewer.world.getItemAt(1).setRotation(v);
        }

        function opacity(v) {
            OSD.viewers[0].viewer.world.getItemAt(0).setOpacity(v?1:0);
            OSD.viewers[1].viewer.world.getItemAt(0).setOpacity(v?1:0);
            OSD.viewers[0].viewer.world.getItemAt(1).setOpacity(v?.6:1);
            OSD.viewers[1].viewer.world.getItemAt(1).setOpacity(v?.6:1);
        }

        function smooth(v) {
            OSD.viewers[0].viewer.drawer.setImageSmoothingEnabled(v);
            OSD.viewers[1].viewer.drawer.setImageSmoothingEnabled(v);
        }

        function snapToDevice(v) {
            OSD.viewers[0].viewer.drawer.snapToDevicePixels = v;
        }

        function setRangeFactor(v) {
            document.getElementById('lrf').textContent = Number(v).toFixed(1)
            OSD.viewers[0].viewer.lodRangeFactor = Number(v);
            OSD.viewers[0].viewer.forceRedraw();
        }

        function onScale(v){
            const viewer = OSD.viewers[0].viewer;
            const scale = viewer.world.getItemAt(1).lastDrawnTileScale;
            // const iScale = Math.round(scale)
            const currentZoom = viewer.viewport.getZoom();
            viewer.viewport.zoomTo(currentZoom/scale*Number(v),null,true);
        }

        function onPerfect(){ // zoom to perfect pixels at current level
            const viewer = OSD.viewers[0].viewer;
            const scale = viewer.world.getItemAt(1).lastDrawnTileScale;
            const iScale = Math.round(scale)
            const currentZoom = viewer.viewport.getZoom();
            viewer.viewport.zoomTo(currentZoom/scale*iScale,null,true);
        }

        function onGCOselect(value){
            OSD.viewers[0].viewer.world.getItemAt(0).setOpacity(value==='source-over' ? 0 : 1);
            OSD.viewers[1].viewer.world.getItemAt(0).setOpacity(value==='source-over' ? 0 : 1);
            OSD.viewers[0].viewer.world.getItemAt(1).compositeOperation = value;
            OSD.viewers[1].viewer.world.getItemAt(1).compositeOperation = value;
            OSD.viewers[0].viewer.forceRedraw();
            OSD.viewers[1].viewer.forceRedraw();
        }

        function buildGCOSelect() {
            const SAFE = [
                "source-over", "source-in", "source-out", "source-atop",
                "destination-over", "destination-in", "destination-out", "destination-atop",
                "lighter", "copy", "xor",
                "multiply", "screen", "overlay", "darken", "lighten",
                "difference", "exclusion"
            ];

            const UNSAFE = [
                "color-dodge", "color-burn", "hard-light", "soft-light",
                "hue", "saturation", "color", "luminosity"
            ];

            const sel = document.getElementById("gco_select");

            function addGroup(label, items) {
                const g = document.createElement("optgroup");
                g.label = label;
                for (const v of items) {
                    const o = document.createElement("option");
                    o.value = v;
                    o.textContent = v;
                    g.appendChild(o);
                }
                sel.appendChild(g);
            }

            addGroup("Safe (tainted canvas OK)", SAFE);
            addGroup("Unsafe (may break on tainted canvas)", UNSAFE);
        }

        function buildViewerSelect(el) {
            for(let i = 0; i < viewers.length; i++){
                const sel = document.getElementById(`viewer${Number(!!i)}`);
                sel.add(new Option( viewers[i].version, i));
            }
        }

    </script>
    <!-- <script>
        document.getElementById("out").textContent =
            document.getElementById("code").textContent;
    </script> -->
</body>
</html>
