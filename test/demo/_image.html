<!DOCTYPE html>
<html>
<head>
    <title>Image TileSource Demo</title>
    <script type="text/javascript" src='../../build/openseadragon/openseadragon.js'></script>
    <!-- <script type="text/javascript" src='/build/openseadragon/v6/openseadragon.js'></script> -->
    <style type="text/css">

        .openseadragon1 {
            width: 1024px;
            height: 768px;
        }

    </style>
</head>
<body>
    <pre>
        Big JPEG image - 90MB, 80MP (7479x11146 px)
    </pre>
    <div style="display: flex;">
        <div id="contentDiv" class="openseadragon1"></div>
        <pre id="out"></pre>
    </div>
    <script id="code" type="text/javascript">

        const url = "../../test/data/MonaLisa.jpg";
        var tileSource = new OpenSeadragon.ImageTileSource ( {url: url, buildPyramid: true, tileWidth: 137, tileHeight: 251} );

        var viewer = OpenSeadragon({
            drawer: 'canvas',
            id: "contentDiv",
            prefixUrl: "../../build/openseadragon/images/",
            showRotationControl: true,
            rotationIncrement: 22.5,
            minZoomLevel: 0.01,
            maxZoomPixelRatio: 2.00,
            tileSources:  tileSource,
            debugMode: true,
        });
    </script>
    <script>
        document.getElementById("out").textContent =
            document.getElementById("code").textContent;
    </script>
</body>
</html>
